<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>NutriGym Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%23A855F7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230A0A0A'/%3E%3Cpath d='M14 34h6l5-12 8 22 6-14 4 4h7' stroke='url(%23g)' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A0A0A'/%3E%3Cpath d='M14 34h6l5-12 8 22 6-14 4 4h7' stroke='%233B82F6' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (solo se usa si configuras FIREBASE_CONFIG más abajo) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0A0A0A;--ink:#F1F5F9;--muted:#94A3B8;--dim:#64748B;
  --glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);
  --blue:#3B82F6;--violet:#A855F7;--cyan:#22D3EE;--good:#22C55E;--bad:#EF4444;--warn:#F59E0B;
  --grad:linear-gradient(135deg,#3B82F6 0%,#8B5CF6 55%,#A855F7 100%);
  --body:#2A3140;--hit:#FF4D4D;--r:18px;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 Inter,"SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px;min-height:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 8% 0%,rgba(59,130,246,.20),transparent 70%),radial-gradient(50% 35% at 95% 8%,rgba(168,85,247,.18),transparent 70%),radial-gradient(60% 40% at 50% 105%,rgba(34,211,238,.10),transparent 70%)}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cyan);text-decoration:none;font-weight:600}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.card{padding:16px;margin-bottom:12px;transition:transform .25s ease,box-shadow .25s ease}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* Encabezado */
header.top{position:sticky;top:0;z-index:30;padding:12px 0 10px;background:rgba(10,10,10,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(10,10,10,.85);z-index:40}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:var(--grad);box-shadow:0 0 18px rgba(139,92,246,.45);flex:none}
.who b{display:block;font-size:1.05rem}
.who small{display:block;color:var(--muted);font-size:.78rem}
.date{color:var(--muted);font-size:.85rem;text-align:right}
.sync{font-size:.72rem;color:var(--dim);text-align:right}
.view{display:none;animation:fade .28s ease}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:1.2rem;font-weight:700}
.note{color:var(--muted);font-size:.85rem}
.small{font-size:.88rem;color:var(--muted)}
/* Hero */
.hero{position:relative;overflow:hidden;padding:20px;margin:16px 0 8px}
.hero::after{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;background:radial-gradient(circle,rgba(168,85,247,.35),transparent 65%);pointer-events:none}
.hero .k{color:var(--cyan);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-size:2.1rem;font-weight:800;margin-top:4px}
.hero p{margin:6px 0 0;color:var(--muted)}
/* Botones y chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--glass2);border-radius:12px;padding:9px 14px;font-weight:600;font-size:.9rem;transition:all .22s ease;white-space:nowrap}
.btn:hover{border-color:rgba(34,211,238,.45);box-shadow:0 0 16px rgba(34,211,238,.18)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 22px rgba(99,102,241,.45)}
.btn.sm{padding:6px 11px;font-size:.84rem;border-radius:10px}
.btn.ghost{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;transition:all .22s ease}
.chip[aria-pressed="true"]{background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;border:1px solid transparent;box-shadow:0 0 18px rgba(139,92,246,.35);color:#fff}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:600;color:var(--muted);margin-left:6px;vertical-align:middle}
.tag.c{color:var(--cyan);border-color:rgba(34,211,238,.35)}
/* Casillas tipo pastilla */
.tick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:9px 12px;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .22s ease;user-select:none}
.tick input{flex:none;appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--dim);display:grid;place-items:center;margin:0;transition:all .2s ease}
.tick input:checked{background:var(--grad);border-color:transparent;box-shadow:0 0 12px rgba(139,92,246,.6)}
.tick input:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick:has(input:checked){border-color:rgba(139,92,246,.6)}
.tick.badx:has(input:checked){border-color:rgba(239,68,68,.7);box-shadow:0 0 14px rgba(239,68,68,.25)}
.tick.badx input:checked{background:var(--bad)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 .tick{justify-content:center;padding:9px 6px;font-size:.84rem}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.yn{display:flex;gap:8px}
/* Comidas */
.meal{display:grid;grid-template-columns:58px 1fr;gap:10px}
.meal.next{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 1px rgba(34,211,238,.25),0 12px 32px rgba(0,0,0,.45)}
.meal .time{font-weight:800;font-size:.9rem;line-height:1.15}
.meal .lab{color:var(--muted);font-size:.8rem;font-weight:600}
.meal h3{font-size:1.05rem;margin-top:2px}
.meal ul{margin:6px 0 0;padding-left:18px;color:#CBD5E1}
.meal li{margin:2px 0}
.kc{font-weight:700;margin-top:3px;color:var(--cyan);font-variant-numeric:tabular-nums}
.pair{margin-top:6px;font-size:.86rem;color:#CBD5E1}
/* Métricas */
.krow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.v{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;box-shadow:0 0 12px rgba(139,92,246,.6);transition:width .4s ease}
.inl{display:flex;gap:8px;margin-top:6px}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=date],select{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Entrenar */
.motiv{padding:16px;margin:14px 0;font-size:1.05rem;font-weight:700;line-height:1.35;background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(168,85,247,.18));border:1px solid rgba(139,92,246,.35);border-radius:var(--r)}
.motiv small{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
.rule{padding:12px 14px;margin:12px 0;font-weight:600;font-size:.9rem;border-left:3px solid var(--cyan)}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0 2px;color:var(--muted);font-size:.88rem}
.meta b{color:var(--ink)}
.block{margin:16px 0;overflow:hidden}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:11px 14px;background:linear-gradient(90deg,rgba(59,130,246,.22),rgba(168,85,247,.12));border-bottom:1px solid var(--line)}
.bhead h3{font-size:1rem;font-weight:700}
.bhead span{font-size:.8rem;color:#CBD5E1;text-align:right}
.ex{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .pic{width:96px;aspect-ratio:120/108;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center}
.ex .pic img{width:100%;height:100%;object-fit:cover}
.ex .num{font-size:.75rem;font-weight:700;color:var(--cyan);letter-spacing:.06em;text-transform:uppercase}
.ex h4{font-size:1rem;margin-top:2px}
.ex .rx{margin-top:4px;font-weight:700}
.ex .mus{font-size:.82rem;color:var(--muted)}
.vids{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.vid{display:inline-flex;align-items:center;gap:4px;font-size:.86rem}
.addv{display:flex;gap:6px;width:100%;margin-top:6px}.addv[hidden]{display:none}
.fam-p{border-top:1px solid var(--line);padding:8px 0}.fam-p summary{padding:4px 0;font-weight:600;font-size:.9rem}.fam-p summary::after{content:""}
.xv{background:none;border:0;color:var(--dim);font-size:.75rem;padding:2px 4px;text-decoration:underline}
.lnk{display:block;text-align:center;font-size:.72rem;color:var(--dim);margin-top:5px;cursor:pointer;text-decoration:underline}
.bm{width:100%;height:auto;display:block}
.bm .b{fill:var(--body)}.bm .on{fill:var(--hit);filter:drop-shadow(0 0 2px rgba(255,77,77,.8))}
.restline{padding:9px 14px;font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line)}
/* Hábitos */
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px}
.glass-b{aspect-ratio:3/4.4;border:1.5px solid var(--line);border-radius:6px 6px 12px 12px;background:transparent;padding:0;position:relative;transition:all .25s}
.glass-b[aria-pressed="true"]{background:linear-gradient(to top,rgba(34,211,238,.85),rgba(59,130,246,.75) 70%,transparent 72%);border-color:rgba(34,211,238,.7);box-shadow:0 0 14px rgba(34,211,238,.35)}
.glass-b.meta-line::after{content:"";position:absolute;right:-4px;top:-6px;bottom:-6px;border-right:2px dashed var(--good)}
.feel{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04)}
.feel .em{font-size:2rem;line-height:1}
.feel.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35)}
.feel.no{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;text-align:center;font-size:.75rem;color:var(--muted)}
.week .e{font-size:1.25rem}
.counter{display:flex;align-items:center;gap:14px;margin-top:10px}
.counter .n{font-size:2.3rem;font-weight:800;min-width:2ch;text-align:center}
.counter button{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--glass2);font-size:1.4rem;font-weight:700}
/* Progreso */
.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dh{text-align:center;font-size:.72rem;color:var(--dim);font-weight:700}
.cd{aspect-ratio:1;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-weight:700;font-size:.85rem}
.cd.out{opacity:.35}.cd:disabled{opacity:.25;cursor:default}
.cd.sel{border-color:var(--cyan);box-shadow:0 0 12px rgba(34,211,238,.35)}
.cd.hoy span{color:var(--cyan)}
.mk{display:flex;gap:4px}.mk i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12)}
.mk i.dy{background:var(--good);box-shadow:0 0 6px var(--good)}.mk i.dn{background:var(--bad)}
.mk i.e{border-radius:2px}.mk i.ey{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}.mk i.en{background:var(--warn)}
.leg{display:inline-flex;align-items:center;gap:5px;margin-left:10px}.leg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.donuts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.donut{display:flex;flex-direction:column;align-items:center;text-align:center}
.donut svg{width:132px;height:132px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:12px;padding-top:6px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted);height:100%;justify-content:flex-end}
.bars .bp{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .bp i{width:40%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:3px;transition:height .4s ease}
.goal .big{font-size:2.2rem;font-weight:800}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.med{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem;min-width:560px}
table.med th{position:sticky;top:0;text-align:right;color:var(--muted);font-weight:700;font-size:.75rem;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.med td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.med th:first-child,table.med td:first-child{text-align:left}
table.med td.g{color:var(--good);font-weight:700}table.med td.r{color:var(--bad);font-weight:700}table.med td.n{color:var(--muted)}
table.med tr.inp td{padding:6px 4px}
table.med tr.inp input{padding:7px 6px;text-align:right;min-width:62px;border-radius:9px}
table.med tr.inp input[type=date]{text-align:left;min-width:130px}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{display:flex;flex-direction:column;gap:6px}
.ph,.pairp div{aspect-ratio:3/4;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:.82rem;text-align:center}
.ph img,.pairp img{width:100%;height:100%;object-fit:cover}
.pairp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
/* Guía */
details{margin-bottom:10px}
summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--cyan)}
details[open] summary::after{content:"–"}
details .in{padding:0 16px 14px;color:#CBD5E1}
details ul{padding-left:18px;margin:6px 0}details li{margin:4px 0}
dl{margin:0}dt{font-weight:700;margin-top:10px;color:var(--ink)}dd{margin:2px 0 0}
/* Hoja de perfiles y modales */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet.on{display:flex;animation:fade .25s ease}
.sheet .panel{width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:rgba(18,18,22,.92);border:1px solid var(--line)}
.plist{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);text-align:left;width:100%}
.prow.on{border-color:rgba(139,92,246,.7);box-shadow:0 0 16px rgba(139,92,246,.3)}
.prow .av{width:36px;height:36px;border-radius:12px;font-size:.9rem}
.alarm{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(40,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.alarm.on{display:flex}
.alarm .box{max-width:380px;width:100%;text-align:center;padding:24px;border-radius:22px;background:rgba(30,10,12,.95);border:1px solid rgba(239,68,68,.6);box-shadow:0 0 40px rgba(239,68,68,.45);animation:pulse 1s ease-in-out infinite}
.alarm .ic{font-size:3rem}
@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(239,68,68,.35)}50%{box-shadow:0 0 60px rgba(239,68,68,.75)}}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:70;padding:10px 16px;border-radius:12px;background:rgba(20,20,26,.95);border:1px solid var(--line);font-weight:600;display:none}
.toast.on{display:block;animation:fade .25s ease}
.login{max-width:420px;margin:12vh auto 0;padding:24px}
/* Barra inferior */
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;border-radius:22px;background:rgba(18,18,22,.75);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:700px;margin:0 auto}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;font-weight:600;font-size:.72rem;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:#fff}
nav.tabs button[aria-current="page"] svg{stroke:url(#tg);filter:drop-shadow(0 0 6px rgba(139,92,246,.7))}
@media (min-width:560px){.hero h1{font-size:2.6rem}.ex{grid-template-columns:116px 1fr}.ex .pic{width:116px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

   (junto a este archivo). Así, al actualizar index.html no se pierde.
   Sin config.js la app funciona en modo local (solo este celular).

const FIREBASE_CONFIG=(window.PLAN_CONFIG&&window.PLAN_CONFIG.firebase&&window.PLAN_CONFIG.firebase.apiKey&&!/PEGA/.test(window.PLAN_CONFIG.firebase.apiKey))?window.PLAN_CONFIG.firebase:null;
const ADMIN_EMAIL=((window.PLAN_CONFIG&&window.PLAN_CONFIG.admin)||"").toLowerCase();

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const now=new Date();
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{const p=String(s).split("-").map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const today=ymd(now);
const dayIdx=Math.floor(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())/864e5);
const dow=now.getDay();
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const cap=s=>String(s).replace(/^./,c=>c.toUpperCase());
const fmt=n=>Math.round(n).toLocaleString("es-MX");
const f1=n=>(Math.round(n*10)/10).toLocaleString("es-MX",{minimumFractionDigits:0,maximumFractionDigits:1});
const dmy=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2);
const fechaLarga=d=>cap(DIAS[d.getDay()])+" "+dmy(d);
const isWeekend=d=>d.getDay()===6||d.getDay()===0;
const weekNo=Math.floor((dayIdx-Math.floor(Date.UTC(2026,0,5)/864e5))/7);
const blockIdx=Math.floor(weekNo/2);
const blockEnd=new Date(Date.UTC(2026,0,5)+((blockIdx+1)*14-1)*864e5);
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const uid=()=>"p"+Math.random().toString(36).slice(2,9);
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2200)}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;const ac=new C();[0,.35,.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.22)})}catch(e){}}
function alarm(t,m){$("#alT").textContent=t;$("#alM").textContent=m;$("#alarm").classList.add("on");beep();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}}
$("#alOk").onclick=()=>$("#alarm").classList.remove("on");

/* ---------- Datos de perfiles ---------- */
const dayDef=()=>({agua:0,cerv:0,refresco:false,mineral:false,aguaNat:false,dieta:null,ent:null,ate:{},extra:0,quem:0});
function seedProfiles(adminEmail){
  const meta=new Date(now);meta.setDate(meta.getDate()+56);
  const base={days:{},medidas:[],settings:{metaCerv:6,time:60,mode:"fuerza"}};
  const mk=(id,info)=>Object.assign({id,info},JSON.parse(JSON.stringify(base)));
  return [
    mk("alejandro",{nombre:"Alejandro",email:adminEmail||"",sexo:"h",nac:"1984-03-15",edad:42,estatura:167,peso:92,objetivo:"bajar",pesoMeta:85,fechaMeta:ymd(meta),inicioPeso:92,inicioFecha:today,plan:"nutri",dias:6,familia:true,grupo:"fuera",pendiente:false}),
    mk("claudia",{nombre:"Claudia",email:"",sexo:"m",nac:"",edad:"",estatura:"",peso:"",objetivo:"bajar",pesoMeta:"",fechaMeta:"",plan:"nutri",dias:3,familia:true,grupo:"casa",pendiente:true}),
    mk("jahir",{nombre:"Jahir",email:"",sexo:"h",nac:"",edad:24,estatura:"",peso:"",objetivo:"mantener",boxeo:true,pesoMant:56,pesoPelea:52,fechaPelea:"",pesoMeta:"",fechaMeta:"",plan:"nutri",dias:4,familia:true,grupo:"fuera",pendiente:true}),
    mk("alexia",{nombre:"Alexia",email:"",sexo:"m",nac:"",edad:17,estatura:"",peso:"",objetivo:"crecer",plan:"bal",dias:3,familia:true,grupo:"casa",pendiente:true}),
    mk("alexito",{nombre:"Alexito",email:"",sexo:"h",nac:"",edad:8,estatura:"",peso:"",objetivo:"crecer",plan:"bal",dias:5,familia:true,grupo:"casa",pendiente:true})
  ];
}
const S={mode:"local",me:null,admin:true,inFamily:true,profiles:{},order:[],cur:null,bad:[],cv:{},fm:{}};
const LKEY="planreyna:v2";
function localLoad(){
  let d=null;try{d=JSON.parse(localStorage.getItem(LKEY)||"null")}catch(e){}
  if(!d||!d.profiles||!Object.keys(d.profiles).length){d={profiles:{},order:[],cur:"alejandro"};seedProfiles("").forEach(p=>{d.profiles[p.id]=p;d.order.push(p.id)})}
  S.profiles=d.profiles;S.order=d.order;S.cur=d.cur&&d.profiles[d.cur]?d.cur:d.order[0];
  try{S.bad=JSON.parse(localStorage.getItem(LKEY+":bad")||"[]")}catch(e){S.bad=[]}
  try{S.cv=JSON.parse(localStorage.getItem(LKEY+":cv")||"{}")}catch(e){S.cv={}}
  try{S.fm=JSON.parse(localStorage.getItem(LKEY+":fm")||"{}")}catch(e){S.fm={}}
}
function localSave(){if(S.mode!=="local")return;try{localStorage.setItem(LKEY,JSON.stringify({profiles:S.profiles,order:S.order,cur:S.cur}))}catch(e){}}
function saveBad(){try{localStorage.setItem(LKEY+":bad",JSON.stringify(S.bad))}catch(e){}}
function saveCV(id){if(S.mode==="local"){try{localStorage.setItem(LKEY+":cv",JSON.stringify(S.cv))}catch(e){}return}
  FS.collection("videos").doc("custom").set({[id]:S.cv[id]||[]},{merge:true}).catch(e=>toast("Sin permiso para guardar videos"))}
function saveFM(k){if(S.mode==="local"){try{localStorage.setItem(LKEY+":fm",JSON.stringify(S.fm))}catch(e){}return}
  FS.collection("menu").doc("m-"+k.slice(0,7)).set({days:{[k]:S.fm[k]||{}}},{merge:true}).catch(e=>toast("Sin permiso para cambiar el menú familiar"))}
const P=()=>S.profiles[S.cur];
const I=()=>P().info;
function age(info){
  if(info.nac){const b=parseYmd(info.nac);let a=now.getFullYear()-b.getFullYear();if(now.getMonth()<b.getMonth()||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate()))a--;return a}
  return +info.edad||0;
}
const isMinor=info=>{const a=age(info);return a>0&&a<18};
const isKid=info=>{const a=age(info);return a>0&&a<13};
function canEditInfo(p){return S.mode==="local"||S.admin}
function canSeeProgress(p){if(S.mode==="local"||S.admin)return true;const e=(S.me&&S.me.email)||"";return p.info.email===e||(p.info.familia&&!p.info.email&&S.inFamily)}
function canRecord(p){if(S.mode==="local"||S.admin)return true;const e=(S.me&&S.me.email)||"";return p.info.email===e||(p.info.familia&&!p.info.email&&S.inFamily)}
function getDay(k,p){p=p||P();return Object.assign(dayDef(),p.days[k]||{})}

/* ---------- Guardado (local o nube) ---------- */
const pending={};
function saveDay(k,obj,p){p=p||P();p.days[k]=obj;if(S.mode==="local"){localSave();return}cloudQueue(p.id,"m-"+k.slice(0,7),()=>{const m={};Object.keys(p.days).forEach(d=>{if(d.slice(0,7)===k.slice(0,7))m[d]=p.days[d]});return{days:m}})}
function saveMedidas(p){p=p||P();if(S.mode==="local"){localSave();return}cloudQueue(p.id,"medidas",()=>({list:p.medidas}))}
function saveSettings(p){p=p||P();if(S.mode==="local"){localSave();return}cloudQueue(p.id,"settings",()=>p.settings)}
function saveInfo(p){p=p||P();if(S.mode==="local"){localSave();return}
  const d=Object.assign({},p.info,{email:(p.info.email||"").toLowerCase().trim(),familia:!!p.info.familia,orden:p.orden||0});
  setSync("Guardando…");FS.collection("profiles").doc(p.id).set(d,{merge:true}).then(()=>setSync("Sincronizado")).catch(e=>{setSync("Sin permiso para guardar");console.warn(e)});
}
function cloudQueue(pid,doc,build){
  const key=pid+"/"+doc;clearTimeout(pending[key]);setSync("Guardando…");
  pending[key]=setTimeout(()=>{delete pending[key];FS.collection("profiles").doc(pid).collection("data").doc(doc).set(build(),{merge:doc.startsWith("m-")?true:false})
    .then(()=>setSync("Sincronizado")).catch(e=>{setSync("Sin permiso para guardar");console.warn(e)})},900);
}
function setSync(t){const el=$("#sync");if(el)el.textContent=t}

/* ---------- Nube: Firebase ---------- */
let FB=null,FS=null,AUTH=null;const unsubs=[];let watched={};
function cloudReady(){return !!(FIREBASE_CONFIG&&window.firebase)}
function startCloud(){
  FB=firebase.initializeApp(FIREBASE_CONFIG);AUTH=firebase.auth();FS=firebase.firestore();
  S.mode="cloud";S.profiles={};S.order=[];
  AUTH.onAuthStateChanged(async u=>{
    unsubs.splice(0).forEach(f=>{try{f()}catch(e){}});watched={};S.profiles={};S.order=[];
    if(!u){S.me=null;renderLogin();return}
    S.me={uid:u.uid,email:(u.email||"").toLowerCase()};
    let fam=null;try{const d=await FS.collection("config").doc("family").get();fam=d.exists?d.data():null}catch(e){fam=null}
    S.admin=!!(fam&&fam.admin&&fam.admin.toLowerCase()===S.me.email)||(ADMIN_EMAIL&&ADMIN_EMAIL.toLowerCase()===S.me.email);
    S.inFamily=S.admin||!!(fam&&(fam.emails||[]).map(x=>String(x).toLowerCase()).includes(S.me.email));
    setSync("Conectado como "+S.me.email);
    const onList=snap=>{
      snap.docChanges().forEach(ch=>{const id=ch.doc.id;
        if(ch.type==="removed"){delete S.profiles[id];S.order=S.order.filter(x=>x!==id);return}
        if(!S.profiles[id]){S.profiles[id]={id,info:{},days:{},medidas:[],settings:{metaCerv:6,time:60,mode:"fuerza"}};if(!S.order.includes(id))S.order.push(id)}
        if(!watched[id]){watched[id]=1;watchData(id)}
        S.profiles[id].info=ch.doc.data();S.profiles[id].orden=ch.doc.data().orden||0;
      });
      S.order.sort((a,b)=>(S.profiles[a].orden||0)-(S.profiles[b].orden||0));
      if(!S.cur||!S.profiles[S.cur]){const mine=S.order.find(id=>S.profiles[id].info.email===S.me.email);S.cur=mine||S.order[0]||null}
      afterData();
    };
    const err=e=>console.warn(e);
    unsubs.push(FS.collection("videos").doc("custom").onSnapshot(d=>{S.cv=d.exists?d.data():{};if(curView==="entrenar")rerender()},err));
    if(S.inFamily)unsubs.push(FS.collection("menu").doc("m-"+today.slice(0,7)).onSnapshot(d=>{Object.assign(S.fm,(d.exists&&d.data().days)||{});if(curView==="hoy")rerender()},err));
    if(S.admin){
      unsubs.push(FS.collection("profiles").onSnapshot(async snap=>{
        if(snap.empty&&!seedProfiles.done){seedProfiles.done=true;const b=FS.batch();seedProfiles(S.me.email).forEach((p,i)=>b.set(FS.collection("profiles").doc(p.id),Object.assign({},p.info,{orden:i})));await b.commit().catch(err);return}
        onList(snap)},err));
    }else{
      unsubs.push(FS.collection("profiles").where("email","==",S.me.email).onSnapshot(onList,err));
      if(S.inFamily)unsubs.push(FS.collection("profiles").where("familia","==",true).onSnapshot(onList,err));
    }
  });
}
function watchData(id){
  unsubs.push(FS.collection("profiles").doc(id).collection("data").onSnapshot(snap=>{
    const p=S.profiles[id];if(!p)return;
    snap.docs.forEach(d=>{const v=d.data()||{};if(pending[id+"/"+d.id])return;
      if(d.id==="medidas")p.medidas=Array.isArray(v.list)?v.list:[];
      else if(d.id==="settings")p.settings=Object.assign({metaCerv:6,time:60,mode:"fuerza"},v);
      else if(d.id.startsWith("m-"))Object.assign(p.days,v.days||{});
    });
    if(id===S.cur)rerender();
  },e=>console.warn(e)));
}
function renderLogin(){
  $("#app").style.display="none";
  let el=$("#loginBox");if(!el){el=document.createElement("div");el.id="loginBox";document.body.appendChild(el)}
  el.style.display="block";
  el.innerHTML=`<div class="login glass"><div class="av" style="width:56px;height:56px;margin-bottom:14px">NG</div><h1 style="font-size:1.6rem">NutriGym <span class="grad-text">Planner</span></h1><p class="small">Entra con tu correo para ver tu plan.</p>
  <label class="fl" style="margin-top:14px">Correo<input type="email" id="lgE" autocomplete="email"></label>
  <label class="fl" style="margin-top:10px">Contraseña<input type="password" id="lgP" autocomplete="current-password"></label>
  <div class="acts"><button class="btn primary" id="lgIn">Entrar</button><button class="btn" id="lgUp">Crear cuenta</button><button class="btn ghost sm" id="lgRe">Olvidé mi contraseña</button></div><p class="small" id="lgMsg"></p></div>`;
  const msg=t=>$("#lgMsg").textContent=t;
  const em=()=>$("#lgE").value.trim().toLowerCase(),pw=()=>$("#lgP").value;
  $("#lgIn").onclick=()=>AUTH.signInWithEmailAndPassword(em(),pw()).catch(e=>msg("No se pudo entrar: revisa correo y contraseña."));
  $("#lgUp").onclick=()=>{if(pw().length<6)return msg("La contraseña debe tener al menos 6 caracteres.");AUTH.createUserWithEmailAndPassword(em(),pw()).catch(e=>msg("No se pudo crear la cuenta: "+(e.code||"")))};
  $("#lgRe").onclick=()=>AUTH.sendPasswordResetEmail(em()).then(()=>msg("Te enviamos un correo para cambiar tu contraseña.")).catch(()=>msg("Escribe tu correo primero."));
}
function afterData(){
  const lb=$("#loginBox");if(lb)lb.style.display="none";
  $("#app").style.display="block";
  if(!S.cur){$("#v-hoy").innerHTML=`<div class="card glass" style="margin-top:20px"><h2>Aún no tienes perfil</h2><p class="small">Pídele al administrador que dé de alta tu perfil con tu correo ${esc(S.me&&S.me.email)}.</p><button class="btn" id="lgOut">Cerrar sesión</button></div>`;$("#lgOut").onclick=()=>AUTH.signOut();show("hoy",true);return}
  rerender();
}

function alloc(gs,n){
  const tot=gs.reduce((a,g)=>a+G[g].w,0);
  const cnt=gs.map(g=>Math.max(1,Math.floor(n*G[g].w/tot)));
  let s=cnt.reduce((a,b)=>a+b,0),i=0;
  while(s<n){cnt[i%gs.length]++;s++;i++}
  while(s>n){const j=cnt.indexOf(Math.max(...cnt));cnt[j]--;s--}
  return cnt;
}
function pickRoutine(gs,need){
  const order=[...gs].sort((a,b)=>(a==="abdomen")-(b==="abdomen")||G[b].w-G[a].w);
  const r=rng(hash(order.join("+")+"|"+blockIdx+"|"+S.cur));
  const cnt=alloc(order,need),used=new Set(),out=[];
  order.forEach((g,gi)=>{
    const all=[...new Set(G[g].slots.flat())];
    for(let i=0;i<cnt[gi];i++){
      let pool=(G[g].slots[i]||[]).filter(x=>!used.has(x));
      if(!pool.length)pool=all.filter(x=>!used.has(x));
      let gg=g;
      if(!pool.length&&G[g].rel){gg=G[g].rel;pool=[...new Set(G[gg].slots.flat())].filter(x=>!used.has(x))}
      if(!pool.length)pool=all;
      const id=pool[Math.floor(r()*pool.length)];used.add(id);out.push({id,g:gg});
    }
  });
  return out;
}

function wireTrain(){
  const v=$("#v-entrenar"),st=P().settings;
  $$("[data-g]",v).forEach(b=>b.onclick=()=>{const k=b.dataset.g;
    if(G[k].out)TS.groups=[k];else{let g=TS.groups.filter(x=>!G[x].out);g=g.includes(k)?g.filter(x=>x!==k):[...g,k];TS.groups=g.length?g:[k]}
    resetSw();renderTrain()});
  $$("[data-t]",v).forEach(b=>b.onclick=()=>{st.time=+b.dataset.t;saveSettings();resetSw();renderTrain()});
  $$("[data-m]",v).forEach(b=>b.onclick=()=>{if(st.mode!==b.dataset.m){st.mode=b.dataset.m;saveSettings();resetSw();renderTrain()}});
  $$("[data-sw]",v).forEach(b=>b.onclick=()=>{const i=+b.dataset.sw;const c=swapCands(TS.cur[i],TS.cur.map(x=>x.id));if(!c.length)return;TS.swN[i]=TS.swN[i]||0;TS.swap[i]=c[TS.swN[i]%c.length];TS.swN[i]++;renderTrain()});
  $$("[data-bad]",v).forEach(b=>b.onclick=()=>{S.bad.push(b.dataset.bad);saveBad();toast("Ocultamos ese video");renderTrain()});
  $$("[data-addv]",v).forEach(b=>b.onclick=()=>{const box=$("#av-"+b.dataset.addv);box.hidden=!box.hidden;if(!box.hidden)box.querySelector("input").focus()});
  $$("[data-savev]",v).forEach(b=>b.onclick=()=>{const id=b.dataset.savev;const val=parseVid($("#av-"+id+" input").value);if(!val)return toast("Pega un enlace válido de YouTube");S.cv=S.cv||{};S.cv[id]=[...(S.cv[id]||[]).filter(x=>x!==val),val];saveCV(id);toast("Video agregado");renderTrain()});
  $$("[data-delv]",v).forEach(b=>b.onclick=()=>{const [id,val]=b.dataset.delv.split("|");S.cv[id]=(S.cv[id]||[]).filter(x=>x!==val);saveCV(id);renderTrain()});
  $$("[data-exup]",v).forEach(inp=>inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;try{await idb.set("ex|"+inp.dataset.exup,await compress(f,700));fillExPics()}catch(e){toast("No se pudo guardar la imagen")}});
}

    else if(w>pm+1)def=300;else if(w<pm-1)def=-200;

    const realDef=Math.max(0,base-meta)+add*0+(1-add)*600*(+i.dias||5)/7;
    const weeksProj=kg&&realDef?kg*7700/(realDef*7):0;const proj=new Date(now);proj.setDate(proj.getDate()+Math.round(weeksProj*7));
    return{w,bmr,base,meta,def,need,cap,kg,daysLeft,capHit,weeksProj,proj,prot:Math.round(w*(mode==="prep"?2.2:2)),box:true,mode,pp,pm,fd,add};
  }
  if(i.objetivo==="bajar"){
    if(+i.pesoMeta>0&&w>+i.pesoMeta&&i.fechaMeta){kg=w-(+i.pesoMeta);daysLeft=Math.max(7,Math.round((parseYmd(i.fechaMeta)-parseYmd(today))/864e5));need=kg*7700/daysLeft;def=Math.min(need,cap);capHit=need>cap}
    else def=500;
  }
  let meta=i.objetivo==="ganar"?base+250:base-def;
  const floorHit=meta<floor;meta=Math.max(floor,meta);meta=Math.round(meta/50)*50;
  const realDef=Math.max(0,base-meta)+.5*400*(+i.dias||4)/7;
  const weeksProj=kg&&realDef?kg*7700/(realDef*7):0;
  const proj=new Date(now);proj.setDate(proj.getDate()+Math.round(weeksProj*7));
  return{w,bmr,base,meta,def,need,cap,kg,daysLeft,capHit,floorHit,weeksProj,proj,prot:Math.round(w*(i.objetivo==="bajar"?1.8:1.6))};
}
/* Porción de cada persona respecto al plato base de un adulto */
function pfac(p){const i=p.info;if(isKid(i))return .6;if(isMinor(i))return i.sexo==="m"?.85:1;const c=calc(p);return c?Math.min(1.3,Math.max(.7,Math.round(c.meta/1700*20)/20)):1}
const QUNITS="gramos|g|tortillas?|tostadas?|huevos?|claras?|tazas?|taza|reb\\.?|rebanadas?|cdas?|cdtas?|cucharadas?|piezas?|pza\\.?|filetes?|latas?|sobres?|paquetes?|barras?|barritas?|aguacates?|panes?|pan|salchichas?|rollitos?|galletas?|doraditas?|hot cakes|totopos|chuletas?|brownies|albóndigas|de taza|de pieza|de aguacate|de pza\\.?";
const QRE=new RegExp("(\\d+(?:[.,]\\d+)?(?:\\/\\d+)?|½|¼|¾)(\\s*(?:a|–|-)\\s*(\\d+(?:[.,]\\d+)?))?(\\s+)("+QUNITS+")(?![a-záéíóúñ])","gi");
function qparse(s){if(s==="½")return .5;if(s==="¼")return .25;if(s==="¾")return .75;if(s.includes("/")){const [a,b]=s.split("/");return +a/+b}return parseFloat(s.replace(",","."))}
function qfmt(n,unit){
  if(/^g|^gramos/i.test(unit))return String(Math.max(10,Math.round(n/10)*10));
  if(/taza|aguacate|cda|cdta|cuchar|pieza|pza/i.test(unit)){const q=Math.max(.25,Math.round(n*4)/4);const w=Math.floor(q),r=q-w;const fr=r===.25?"¼":r===.5?"½":r===.75?"¾":"";return (w?String(w):"")+fr||"¼"}
  return String(Math.max(1,Math.round(n)));
}
function sing(u){if(/^panes$/i.test(u))return "pan";if(/^(g|gramos|hot cakes)$/i.test(u))return u;return u.replace(/s$/i,"")}
function scaleText(s,f){if(f===1)return s;return s.replace(QRE,(m,a,rng,b,sp,u)=>{const x=qfmt(qparse(a)*f,u),y=b?qfmt(qparse(b)*f,u):null;if(y===x)return x+sp+(x==="1"?sing(u):u);return x+(y?" a "+y:"")+sp+((x==="1"&&!y)?sing(u):u)})}

  <details class="glass"><summary>Semana tipo de entrenamiento</summary><div class="in"><ul><li><b>Lunes:</b> pierna + pantorrilla</li><li><b>Martes:</b> pecho + tríceps</li><li><b>Miércoles:</b> glúteo y femoral + abdomen</li><li><b>Jueves:</b> espalda + bíceps + antebrazo</li><li><b>Viernes:</b> hombro + abdomen</li><li><b>Sábado:</b> box, correr, caminadora, cardio o futbol</li><li><b>Domingo:</b> descanso</li></ul></div></details>
  <details class="glass"><summary>Cómo entrenar</summary><div class="in"><dl>
  <dt>Fuerza</dt><dd>Puras biseries: dos ejercicios seguidos sin descanso; al terminar descansa 60–90 s.</dd>
  <dt>Fuerza mixta</dt><dd>Puras triseries: tres ejercicios seguidos sin descanso; al terminar descansa 90–120 s.</dd>
  <dt>Circuito</dt><dd>Todos los ejercicios seguidos, con el mismo peso en todas las vueltas; descansa 90–120 s al terminar cada vuelta.</dd>
  <dt>Series y repeticiones</dt><dd>45 min o 1 hora: 3 series de 10. 1.5 o 2 horas: 4 series de 10 a 12, más 25 minutos de caminadora o escaladora.</dd>
  <dt>Videos</dt><dd>Toca “Buscar” para encontrar un video en YouTube y “Subir video” para pegar su enlace. Queda guardado para ese ejercicio y lo ve toda la familia. Si un video no corresponde, toca “no corresponde”.</dd></dl></div></details>
  <details class="glass"><summary>Rutina de box</summary><div class="in"><ul><li>Calentamiento: giros de muñecas, tobillos, cintura y cuello, 10 hacia cada lado.</li><li>2 rounds de cuerda y 2 de sombra.</li><li>6 rounds de costal con combinaciones de 4 a 6 golpes y pasos laterales.</li><li>3 rounds de pera loca y 1 de pera fija.</li><li>Manopleo o combinaciones.</li><li>200 abdominales entre rueda, crunch, elevación de piernas y bicicleta, más plancha.</li></ul></div></details>
  <details class="glass"><summary>Snacks y con qué acompañarlos</summary><div class="in"><ul>${SNA.map(s=>`<li>${esc(s[0])} (${s[1]} kcal): con ${esc(s[2])}</li>`).join("")}</ul><p class="small">Las frituras, la fruta y lo salado van con agua; el café o té verde solo con galletas o barritas.</p></div></details>
  <details class="glass"><summary>Comer fuera de casa</summary><div class="in"><dl>${ALL_F.map(x=>`<dt>${esc(x[0])} (unas ${fmt(x[2])} kcal)</dt><dd>${esc(x[1])}</dd>`).join("")}</dl></div></details>
  <details class="glass"><summary>Alcohol</summary><div class="in"><ul><li>Solo fin de semana, con tu meta de cervezas. La app te avisa con una alarma si te pasas.</li><li>1 lata de cerveza: unas 155 kcal.</li></ul></div></details>
  <details class="glass"><summary>Familia y privacidad</summary><div class="in"><p>Toda la familia puede ver el menú de cada quien. Los hábitos, las medidas y el progreso de cada adulto solo los ve esa persona y el administrador; los de Alexito los pueden actualizar sus papás. Cualquier otra persona a la que le compartas la app solo verá su propio perfil. Las fotos nunca se suben: se quedan en el celular de cada quien.</p></div></details>`;
}

/* ---------- Perfiles ---------- */
function openSheet(){
  const pn=$("#sheetPanel");const canAdd=S.mode==="local"||S.admin;
  pn.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Perfiles</h2><button class="btn sm" id="shClose">Cerrar</button></div>
  <p class="small">${S.mode==="cloud"?`Conectado como ${esc(S.me.email)}${S.admin?" (administrador)":""}.`:"Modo local: los datos se guardan solo en este celular."}</p>
  <div class="plist">${S.order.map(id=>{const p=S.profiles[id],i=p.info;return `<button class="prow${id===S.cur?" on":""}" data-pick="${id}"><span class="av">${esc((i.nombre||"?").slice(0,1))}</span><span style="flex:1"><b>${esc(i.nombre||"Sin nombre")}</b><br><span class="small">${age(i)?age(i)+" años · ":""}${i.familia?"Familia":"Solo su perfil"}${i.pendiente?" · faltan datos":""}</span></span>${canEditInfo(p)?`<span class="btn sm" data-ed="${id}">Editar</span>`:""}</button>`}).join("")}</div>
  <div class="acts">${canAdd?`<button class="btn primary" id="shAdd">+ Agregar persona</button>`:""}${S.mode==="cloud"?`<button class="btn" id="shOut">Cerrar sesión</button>`:""}</div>`;
  $("#sheet").classList.add("on");
  $("#shClose").onclick=closeSheet;
  $$("[data-pick]",pn).forEach(b=>b.onclick=e=>{if(e.target.closest("[data-ed]"))return;S.cur=b.dataset.pick;localSave();TS.groups=null;resetSw();closeSheet();rerender()});
  $$("[data-ed]",pn).forEach(b=>b.onclick=e=>{e.stopPropagation();openEditor(b.dataset.ed)});
  const ad=$("#shAdd");if(ad)ad.onclick=()=>{const id=uid();const np={id,info:{nombre:"",email:"",sexo:"h",nac:"",edad:"",estatura:"",peso:"",objetivo:"bajar",grupo:"fuera",dias:3,familia:false,pendiente:true},days:{},medidas:[],settings:{metaCerv:6,time:60,mode:"fuerza"},orden:S.order.length};S.profiles[id]=np;S.order.push(id);openEditor(id,true)};
  const so=$("#shOut");if(so)so.onclick=()=>{closeSheet();AUTH.signOut()};
}
function closeSheet(){$("#sheet").classList.remove("on")}
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
function openEditor(id,isNew){
  const p=S.profiles[id],i=p.info,minor=isMinor(i);
  const plus=m=>{const d=new Date(now);d.setMonth(d.getMonth()+m);return ymd(d)};
  const pn=$("#sheetPanel");
  pn.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>${isNew?"Nueva persona":"Editar "+esc(i.nombre)}</h2><button class="btn sm" id="edCancel">Cancelar</button></div>
  <div class="grid2" style="margin-top:12px">
   <label class="fl">Nombre<input type="text" id="eNom" value="${esc(i.nombre)}"></label>
   <label class="fl">Correo de su cuenta<input type="email" id="eMail" value="${esc(i.email)}" placeholder="opcional"></label>
   <label class="fl">Sexo<select id="eSex"><option value="h" ${i.sexo!=="m"?"selected":""}>Hombre</option><option value="m" ${i.sexo==="m"?"selected":""}>Mujer</option></select></label>
   <label class="fl">Fecha de nacimiento<input type="date" id="eNac" value="${esc(i.nac)}"></label>
   <label class="fl">Edad (si no sabes la fecha)<input type="number" id="eEdad" min="1" max="100" value="${esc(i.edad)}"></label>
   <label class="fl">Estatura (cm)<input type="number" id="eEst" step="0.5" value="${esc(i.estatura)}"></label>
   <label class="fl">Peso actual (kg)<input type="number" id="ePeso" step="0.1" value="${esc(lastPeso(p)||i.peso)}"></label>
   <label class="fl">Días de ejercicio por semana<input type="number" id="eDias" min="0" max="7" value="${esc(i.dias)}"></label>
   <label class="fl">Objetivo<select id="eObj"><option value="bajar" ${i.objetivo==="bajar"?"selected":""}>Bajar grasa sin perder músculo</option><option value="mantener" ${i.objetivo==="mantener"?"selected":""}>Mantenerme</option><option value="ganar" ${i.objetivo==="ganar"?"selected":""}>Ganar músculo</option></select></label>
   <label class="fl">Desayuno y comida entre semana<select id="eGrupo"><option value="casa" ${i.grupo==="casa"?"selected":""}>En casa, igual que Claudia y los niños</option><option value="fuera" ${i.grupo!=="casa"?"selected":""}>Su propio menú</option></select></label>
   <label class="fl">Peso meta (kg)<input type="number" id="eMeta" step="0.1" value="${esc(i.pesoMeta)}"></label>
   <label class="fl">Fecha meta<input type="date" id="eFecha" value="${esc(i.fechaMeta)}"></label>
  </div>
  <div class="chips" style="margin-top:6px"><span class="small" style="align-self:center">Fecha meta rápida:</span>${[1,2,3,6].map(m=>`<button class="chip" data-plus="${plus(m)}">${m} ${m===1?"mes":"meses"}</button>`).join("")}</div>
  <div class="card glass" style="margin-top:10px;padding:12px"><label class="tick"><input type="checkbox" id="eBox" ${i.boxeo?"checked":""}>Es boxeador o peleador</label>
  <div class="grid2" style="margin-top:10px"><label class="fl">Peso de mantenimiento (kg)<input type="number" id="ePM" step="0.1" value="${esc(i.pesoMant||"")}"></label><label class="fl">Peso de pelea (kg)<input type="number" id="ePP" step="0.1" value="${esc(i.pesoPelea||"")}"></label><label class="fl">Fecha de la próxima pelea<input type="date" id="eFP" value="${esc(i.fechaPelea||"")}"></label></div>
  <p class="small" style="margin:8px 0 0">Sin pelea cerca, la dieta lo mantiene en su peso de mantenimiento. Dos meses antes de la pelea cambia sola a preparación: bajar grasa sin perder músculo hasta su peso de pelea.</p></div>
  <label class="tick" style="margin-top:10px"><input type="checkbox" id="eFam" ${i.familia?"checked":""}>Es de la familia (puede ver y ser visto por la familia)</label>
  <p class="small" id="eMsg">Para menores de 18 años no se usan metas de peso ni déficit de calorías: se arma un menú para crecer sano.</p>
  <div class="acts"><button class="btn primary" id="edSave">Guardar</button></div>`;
  $("#sheet").classList.add("on");
  $$("[data-plus]",pn).forEach(b=>b.onclick=()=>{$("#eFecha").value=b.dataset.plus});
  $("#edCancel").onclick=()=>{if(isNew){delete S.profiles[id];S.order=S.order.filter(x=>x!==id)}openSheet()};
  $("#edSave").onclick=()=>{
    const v=x=>$(x).value.trim();const num=x=>{const n=parseFloat(v(x));return isFinite(n)?n:""};
    const oldMeta=i.pesoMeta,oldFecha=i.fechaMeta;
    Object.assign(i,{nombre:v("#eNom")||"Sin nombre",email:v("#eMail").toLowerCase(),sexo:v("#eSex"),nac:v("#eNac"),edad:num("#eEdad"),estatura:num("#eEst"),dias:num("#eDias")||3,objetivo:v("#eObj"),grupo:v("#eGrupo"),pesoMeta:num("#eMeta"),fechaMeta:v("#eFecha"),familia:$("#eFam").checked,boxeo:$("#eBox").checked,pesoPelea:num("#ePP"),pesoMant:num("#ePM"),fechaPelea:v("#eFP")});
    const peso=num("#ePeso");
    if(peso&&peso!==lastPeso(p)){i.peso=peso;p.medidas=(p.medidas||[]).filter(r=>r.f!==today);p.medidas.push({f:today,peso});saveMedidas(p)}else if(peso)i.peso=peso;
    if(isMinor(i)){i.objetivo="crecer";i.pesoMeta="";i.fechaMeta=""}
    if(i.pesoMeta&&(i.pesoMeta!==oldMeta||i.fechaMeta!==oldFecha||!i.inicioPeso)){i.inicioPeso=lastPeso(p)||i.peso;i.inicioFecha=today}
    i.pendiente=!(i.estatura&&i.peso&&age(i));
    if(isNew&&S.mode==="cloud"){FS.collection("profiles").doc(id).set(Object.assign({},i,{orden:p.orden||0})).catch(e=>toast("Sin permiso para crear perfiles"))}else saveInfo(p);
    closeSheet();toast("Perfil guardado");rerender();
  };
}

/* ---------- Navegación e inicio ---------- */
const VIEWS=["hoy","entrenar","habitos","progreso","guia"];
let curView="hoy";
function header(){
  const p=P();if(!p)return;const i=p.info;
  $("#avTxt").textContent=(i.nombre||"?").slice(0,1).toUpperCase();
  $("#whoName").textContent=i.nombre||"Sin nombre";
  $("#whoSub").textContent=(age(i)?age(i)+" años · ":"")+(isMinor(i)?"Crecer sano":i.boxeo?"Boxeador":i.objetivo==="bajar"?"Bajar grasa":i.objetivo==="ganar"?"Ganar músculo":"Mantenerse")+" · cambiar";
  $("#fecha").textContent=fechaLarga(now);
}
function rerender(){if(!P())return;header();renderView(curView)}
function renderView(v){if(v==="hoy")renderHoy();if(v==="entrenar")renderTrain();if(v==="habitos")renderHab();if(v==="progreso")renderProg();if(v==="guia")renderGuia()}
function show(v,noRender){curView=v;VIEWS.forEach(x=>$("#v-"+x).classList.toggle("on",x===v));$$("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v?"page":"false"));if(!noRender&&P())renderView(v);window.scrollTo(0,0)}
$$("nav.tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
$("#whoBtn").onclick=openSheet;
(function init(){
  const start=(location.hash||"").slice(1);curView=VIEWS.includes(start)?start:"hoy";
  if(cloudReady()){show(curView,true);startCloud();return}
  localLoad();setSync("Modo local");show(curView,true);rerender();
})();
</script>
