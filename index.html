<!-- Firebase se carga después de mostrar la app, para que abra rápido aunque la señal sea lenta -->
<style>
:root{
  --bg:#0A0A0A;--ink:#F1F5F9;--muted:#94A3B8;--dim:#64748B;
  --glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);
  --blue:#3B82F6;--violet:#A855F7;--cyan:#22D3EE;--good:#22C55E;--bad:#EF4444;--warn:#F59E0B;
  --grad:linear-gradient(135deg,#3B82F6 0%,#8B5CF6 55%,#A855F7 100%);
  --body:#2A3140;--hit:#FF4D4D;--r:18px;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 Inter,"SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px;min-height:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 8% 0%,rgba(59,130,246,.20),transparent 70%),radial-gradient(50% 35% at 95% 8%,rgba(168,85,247,.18),transparent 70%),radial-gradient(60% 40% at 50% 105%,rgba(34,211,238,.10),transparent 70%)}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cyan);text-decoration:none;font-weight:600}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06)}
.card{padding:16px;margin-bottom:12px;transition:transform .25s ease,box-shadow .25s ease}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* Encabezado */
header.top{position:sticky;top:0;z-index:30;padding:12px 0 10px;background:rgba(10,10,10,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
body::after{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(10,10,10,.85);z-index:40}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:var(--grad);box-shadow:0 0 18px rgba(139,92,246,.45);flex:none}
.who b{display:block;font-size:1.05rem}
.who small{display:block;color:var(--muted);font-size:.78rem}
.date{color:var(--muted);font-size:.85rem;text-align:right}
.sync{font-size:.72rem;color:var(--dim);text-align:right}
.view{display:none;animation:fade .28s ease}.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:1.2rem;font-weight:700}
.note{color:var(--muted);font-size:.85rem}
.small{font-size:.88rem;color:var(--muted)}
/* Hero */
.hero{position:relative;overflow:hidden;padding:20px;margin:16px 0 8px}
.hero::after{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;background:radial-gradient(circle,rgba(168,85,247,.35),transparent 65%);pointer-events:none}
.hero .k{color:var(--cyan);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hero h1{font-size:2.1rem;font-weight:800;margin-top:4px}
.hero p{margin:6px 0 0;color:var(--muted)}
/* Botones y chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--glass2);border-radius:12px;padding:9px 14px;font-weight:600;font-size:.9rem;transition:all .22s ease;white-space:nowrap}
.btn:hover{border-color:rgba(34,211,238,.45);box-shadow:0 0 16px rgba(34,211,238,.18)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 22px rgba(99,102,241,.45)}
.btn.sm{padding:6px 11px;font-size:.84rem;border-radius:10px}
.btn.ghost{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;transition:all .22s ease}
.chip[aria-pressed="true"]{background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;border:1px solid transparent;box-shadow:0 0 18px rgba(139,92,246,.35);color:#fff}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:600;color:var(--muted);margin-left:6px;vertical-align:middle}
.tag.c{color:var(--cyan);border-color:rgba(34,211,238,.35)}
/* Casillas tipo pastilla */
.tick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass);border-radius:12px;padding:9px 12px;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .22s ease;user-select:none}
.tick input{flex:none;appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:6px;border:1.5px solid var(--dim);display:grid;place-items:center;margin:0;transition:all .2s ease}
.tick input:checked{background:var(--grad);border-color:transparent;box-shadow:0 0 12px rgba(139,92,246,.6)}
.tick input:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tick:has(input:checked){border-color:rgba(139,92,246,.6)}
.tick.badx:has(input:checked){border-color:rgba(239,68,68,.7);box-shadow:0 0 14px rgba(239,68,68,.25)}
.tick.badx input:checked{background:var(--bad)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 .tick{justify-content:center;padding:9px 6px;font-size:.84rem}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.yn{display:flex;gap:8px}
/* Comidas */
.meal{display:grid;grid-template-columns:58px 1fr;gap:10px}
.meal.next{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 1px rgba(34,211,238,.25),0 12px 32px rgba(0,0,0,.45)}
.meal .time{font-weight:800;font-size:.9rem;line-height:1.15}
.meal .lab{color:var(--muted);font-size:.8rem;font-weight:600}
.meal h3{font-size:1.05rem;margin-top:2px}
.meal ul{margin:6px 0 0;padding-left:18px;color:#CBD5E1}
.meal li{margin:2px 0}
.kc{font-weight:700;margin-top:3px;color:var(--cyan);font-variant-numeric:tabular-nums}
.pair{margin-top:6px;font-size:.86rem;color:#CBD5E1}
/* Métricas */
.krow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.v{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;box-shadow:0 0 12px rgba(139,92,246,.6);transition:width .4s ease}
.inl{display:flex;gap:8px;margin-top:6px}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=date],select{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:border .2s}
input:focus,select:focus{border-color:rgba(34,211,238,.6);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Entrenar */
.motiv{padding:16px;margin:14px 0;font-size:1.05rem;font-weight:700;line-height:1.35;background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(168,85,247,.18));border:1px solid rgba(139,92,246,.35);border-radius:var(--r)}
.motiv small{display:block;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
.rule{padding:12px 14px;margin:12px 0;font-weight:600;font-size:.9rem;border-left:3px solid var(--cyan)}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0 2px;color:var(--muted);font-size:.88rem}
.meta b{color:var(--ink)}
.block{margin:16px 0;overflow:hidden}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:11px 14px;background:linear-gradient(90deg,rgba(59,130,246,.22),rgba(168,85,247,.12));border-bottom:1px solid var(--line)}
.bhead h3{font-size:1rem;font-weight:700}
.bhead span{font-size:.8rem;color:#CBD5E1;text-align:right}
.ex{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .pic{width:96px;aspect-ratio:200/206;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center}
.ex .pic img{width:100%;height:100%;object-fit:cover}
.ex .num{font-size:.75rem;font-weight:700;color:var(--cyan);letter-spacing:.06em;text-transform:uppercase}
.ex h4{font-size:1rem;margin-top:2px}
.ex .rx{margin-top:4px;font-weight:700}
.ex .mus{font-size:.82rem;color:var(--muted)}
.vids{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.vid{display:inline-flex;align-items:center;gap:4px;font-size:.86rem}
.addv{display:flex;gap:6px;width:100%;margin-top:6px}.addv[hidden]{display:none}
.fam-p{border-top:1px solid var(--line);padding:8px 0}.fam-p summary{padding:4px 0;font-weight:600;font-size:.9rem}.fam-p summary::after{content:""}
.xv{background:none;border:0;color:var(--dim);font-size:.75rem;padding:2px 4px;text-decoration:underline}
.lnk{display:block;text-align:center;font-size:.72rem;color:var(--dim);margin-top:5px;cursor:pointer;text-decoration:underline}
.bm{width:100%;height:auto;display:block}
.bm .b{fill:var(--body)}.bm .on{fill:var(--hit);filter:drop-shadow(0 0 2px rgba(255,77,77,.8))}
.anat{width:100%;height:auto;display:block}
.anat .bd{fill:#1C2533}.anat .ar{fill:none;stroke:#1C2533;stroke-width:9;stroke-linecap:round}.anat .hr{fill:#0F172A}
.anat .mu{fill:rgba(148,163,184,.14);stroke:rgba(34,211,238,.35);stroke-width:.5;transition:fill .25s ease,filter .25s ease}
.anat .mu.on{fill:#FF3B3B;stroke:#FFB4B4;filter:drop-shadow(0 0 2px rgba(255,59,59,.9))}
.anat.big .bd{fill:#132033;stroke:rgba(34,211,238,.28);stroke-width:.6}.anat.big .ar{stroke:#132033}
.anat.big .mu{cursor:pointer}.anat.big .mu.on{animation:pulseM 1.6s ease-in-out infinite}
.anat.big .mu.hov{fill:#FF6B6B;filter:drop-shadow(0 0 4px #FF3B3B)}
@keyframes pulseM{50%{fill:#FF5A5A;filter:drop-shadow(0 0 6px rgba(255,59,59,1))}}
.anat .floor{fill:rgba(34,211,238,.22)}
.anat .lb{font:700 6px Inter,sans-serif;fill:#64748B;text-anchor:middle;letter-spacing:.2em}
.holo-card{padding:14px;position:relative;overflow:hidden;margin-bottom:12px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.holo-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.segb{border:0;background:none;padding:7px 11px;border-radius:9px;font-weight:600;font-size:.82rem;color:var(--muted);transition:all .22s ease}
.segb[aria-pressed="true"]{background:rgba(255,59,59,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,59,59,.65),0 0 14px rgba(255,59,59,.3)}
.holo-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media(min-width:560px){.holo-grid{grid-template-columns:1.2fr 1fr;align-items:center}}
.holo{position:relative;perspective:700px;border-radius:16px;padding:8px 0;overflow:hidden;border:1px solid rgba(34,211,238,.15);background:radial-gradient(60% 50% at 50% 55%,rgba(34,211,238,.12),transparent 70%),repeating-linear-gradient(0deg,rgba(34,211,238,.05) 0 1px,transparent 1px 14px),#07090D}
.holo-in{animation:sway 7s ease-in-out infinite alternate;transform-style:preserve-3d}
@keyframes sway{from{transform:rotateY(-12deg)}to{transform:rotateY(12deg)}}
.anat.big{animation:breathe 3.5s ease-in-out infinite;transform-origin:50% 90%}
@keyframes breathe{50%{transform:scale(1.015)}}
.scan{position:absolute;left:0;right:0;height:46px;top:-46px;background:linear-gradient(to bottom,transparent,rgba(34,211,238,.20),transparent);animation:scan 3.8s linear infinite;pointer-events:none}
@keyframes scan{to{top:100%}}
.selrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.selchip{border:1px solid rgba(255,59,59,.6);background:rgba(255,59,59,.12);color:#fff;border-radius:999px;padding:5px 10px;font-size:.82rem;font-weight:600}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtn{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:10px 12px;transition:all .22s ease}
.mbtn b{display:block;font-size:.95rem}.mbtn small{color:var(--muted);font-size:.74rem}
.mbtn:hover{border-color:rgba(255,59,59,.5)}
.mbtn[aria-pressed="true"]{border-color:rgba(255,59,59,.8);background:linear-gradient(135deg,rgba(255,59,59,.18),rgba(168,85,247,.10));box-shadow:0 0 18px rgba(255,59,59,.3)}
.daystrip{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.dayb{display:flex;flex-direction:column;align-items:center;min-width:72px;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:var(--glass);transition:all .22s ease}
.dayb small{font-size:.72rem;color:var(--muted);font-weight:600}.dayb b{font-size:1.25rem}
.dayb[aria-pressed="true"]{background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;border:1px solid transparent;box-shadow:0 0 18px rgba(139,92,246,.35)}
details.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
details.more summary{padding:4px 0;font-size:.86rem;font-weight:600;color:var(--cyan)}details.more summary::after{content:"+";float:right}details.more[open] summary::after{content:"–"}
.eqs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eqb{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:12px;padding:8px 10px}
.eqb b{display:block;font-size:.84rem}.eqb small{color:var(--muted);font-size:.74rem}.eqb:hover{border-color:rgba(34,211,238,.5)}
ul.subs{margin:4px 0 0;padding-left:16px;font-size:.82rem;color:#CBD5E1}ul.subs li{margin:3px 0}
details.shopcat{border-top:1px solid var(--line)}details.shopcat summary{padding:10px 0;font-weight:700}
details.shopcat ul{list-style:none;margin:0 0 8px;padding:0}details.shopcat li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:.9rem}
.mk i.pl{background:var(--violet);box-shadow:0 0 6px var(--violet)}
.weekbar{padding:12px;margin:14px 0 10px}
.weekhead{display:flex;align-items:center;gap:10px;justify-content:space-between}.weekhead b{flex:1}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 8px}
.dayb{display:flex;flex-direction:column;align-items:center;padding:7px 0;border-radius:12px;border:1px solid var(--line);background:var(--glass);transition:all .22s ease;min-width:0}
.dayb small{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:capitalize}.dayb b{font-size:1.05rem}.dayb.past{opacity:.55}
.dayb[aria-pressed="true"]{opacity:1;background:linear-gradient(var(--bg),var(--bg)) padding-box,var(--grad) border-box;border:1px solid transparent;box-shadow:0 0 16px rgba(139,92,246,.35)}
.planbar{display:flex;gap:8px;flex-wrap:wrap}.planbar .btn{flex:1}
.shopbox{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:6px}.shopgrid ul{margin:4px 0 0;padding-left:16px;font-size:.86rem;color:#CBD5E1}.shopgrid b{font-size:.85rem;color:var(--cyan)}
.hero.slim{padding:14px 18px;margin:0 0 10px}.hero.slim h1{font-size:1.5rem}
.kcard .v{font-size:1.4rem}details.mini summary{font-size:.82rem;color:var(--cyan);padding:8px 0 0;cursor:pointer}
.meal2{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}
.meal2.next{border-color:rgba(34,211,238,.55)}
.mph{width:76px;height:76px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,rgba(168,85,247,.35),rgba(59,130,246,.15) 60%,rgba(255,255,255,.03));border:1px solid var(--line);font-size:2.1rem}
.mph img{width:100%;height:100%;object-fit:cover}
.mb h3{font-size:1.02rem;margin-top:2px}.mb .lab{font-size:.76rem;color:var(--muted);font-weight:600}
details.rec{margin-top:10px;border-top:1px dashed var(--line);padding-top:4px}
details.rec summary{padding:6px 0;font-size:.86rem;font-weight:600;color:var(--cyan);cursor:pointer}details.rec summary::after{content:"+";float:right}details.rec[open] summary::after{content:"–"}
details.rec h4{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
ul.ing{margin:0;padding-left:18px;color:#E2E8F0;font-size:.9rem}ul.ing li{margin:3px 0}
.grps{display:flex;flex-direction:column;gap:6px}.grp{display:grid;grid-template-columns:10px 92px 1fr;gap:8px;align-items:baseline;font-size:.84rem;color:#CBD5E1}.grp b{color:var(--ink)}
.gdot{width:10px;height:10px;border-radius:50%;display:inline-block}
ol.steps{margin:0;padding-left:20px;font-size:.88rem;color:#E2E8F0}ol.steps li{margin:5px 0}
.plate{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin-top:14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.plate svg{width:110px;height:110px}.plate .pl{display:flex;align-items:center;gap:6px;font-size:.82rem;margin-top:4px}
details.famd{padding:12px 14px}details.famd summary{display:flex;flex-direction:column;gap:2px;cursor:pointer;list-style:none}
.famrow{padding:8px 0;border-top:1px solid var(--line)}.famrow:first-of-type{margin-top:8px}
h4.edh{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--cyan);margin:18px 0 8px}
input[type=time]{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}

function age(info){

  return +info.edad||0;
}
const isMinor=info=>{const a=age(info);return a>0&&a<18};

const pending={};
function saveDay(k,obj,p){p=p||P();p.days[k]=obj;if(S.mode==="local"){localSave();return}cloudQueue(p.id,"m-"+k.slice(0,7),()=>{const m={};Object.keys(p.days).forEach(d=>{if(d.slice(0,7)===k.slice(0,7))m[d]=p.days[d]});return{days:m}})}

  const d=Object.assign({},p.info,{email:(p.info.email||"").toLowerCase().trim(),familia:!!p.info.familia,orden:p.orden||0});
  setSync("Guardando…");FS.collection("profiles").doc(p.id).set(d,{merge:true}).then(()=>setSync("Sincronizado")).catch(e=>{setSync("Sin permiso para guardar");console.warn(e)});
}
function cloudQueue(pid,doc,build){
  const key=pid+"/"+doc;clearTimeout(pending[key]);setSync("Guardando…");
  pending[key]=setTimeout(()=>{delete pending[key];FS.collection("profiles").doc(pid).collection("data").doc(doc).set(build(),{merge:doc.startsWith("m-")?true:false})
    .then(()=>setSync("Sincronizado")).catch(e=>{setSync("Sin permiso para guardar");console.warn(e)})},900);
}

/* ---------- Nube: Firebase ---------- */
let FB=null,FS=null,AUTH=null;const unsubs=[];let watched={};
function cloudReady(){return !!(FIREBASE_CONFIG&&window.firebase)}
function hideSplash(){const s=document.getElementById("splash");if(s)s.remove()}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=res;s.onerror=()=>rej(new Error(src));document.head.appendChild(s)})}
function loadFirebase(){const v="https://www.gstatic.com/firebasejs/10.12.2/";return loadScript(v+"firebase-app-compat.js").then(()=>Promise.all([loadScript(v+"firebase-auth-compat.js"),loadScript(v+"firebase-firestore-compat.js")]))}
function bootCloud(){
  const msg=document.getElementById("splashMsg"),rt=document.getElementById("splashRetry");
  if(msg)msg.textContent="Conectando…";if(rt)rt.hidden=true;
  const slow=setTimeout(()=>{if(msg)msg.textContent="La señal está lenta, seguimos intentando…"},6000);
  loadFirebase().then(()=>{clearTimeout(slow);startCloud()}).catch(()=>{clearTimeout(slow);
    if(msg)msg.textContent="No hay conexión. Revisa tus datos o tu wifi y vuelve a intentar.";if(rt){rt.hidden=false;rt.onclick=bootCloud}});
}
function startCloud(){
  FB=firebase.initializeApp(FIREBASE_CONFIG);AUTH=firebase.auth();FS=firebase.firestore();
  try{FS.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  S.mode="cloud";S.profiles={};S.order=[];
  AUTH.onAuthStateChanged(async u=>{
    unsubs.splice(0).forEach(f=>{try{f()}catch(e){}});watched={};S.profiles={};S.order=[];
    if(!u){S.me=null;renderLogin();return}
    S.me={uid:u.uid,email:(u.email||"").toLowerCase()};
    let fam=null;try{const d=await FS.collection("config").doc("family").get();fam=d.exists?d.data():null}catch(e){fam=null}
    S.admin=!!(fam&&fam.admin&&fam.admin.toLowerCase()===S.me.email)||(ADMIN_EMAIL&&ADMIN_EMAIL.toLowerCase()===S.me.email);
    S.inFamily=S.admin||!!(fam&&(fam.emails||[]).map(x=>String(x).toLowerCase()).includes(S.me.email));
    setSync("Conectado como "+S.me.email);
    const onList=snap=>{
      snap.docChanges().forEach(ch=>{const id=ch.doc.id;
        if(ch.type==="removed"){delete S.profiles[id];S.order=S.order.filter(x=>x!==id);return}
        if(!S.profiles[id]){S.profiles[id]={id,info:{},days:{},medidas:[],settings:{metaCerv:6,time:60,mode:"fuerza"}};if(!S.order.includes(id))S.order.push(id)}
        if(!watched[id]){watched[id]=1;watchData(id)}
        S.profiles[id].info=ch.doc.data();S.profiles[id].orden=ch.doc.data().orden||0;
      });
      S.order.sort((a,b)=>(S.profiles[a].orden||0)-(S.profiles[b].orden||0));
      if(!S.cur||!S.profiles[S.cur]){const mine=S.order.find(id=>S.profiles[id].info.email===S.me.email);S.cur=mine||S.order[0]||null}
      afterData();
    };
    const err=e=>console.warn(e);
    unsubs.push(FS.collection("videos").doc("custom").onSnapshot(d=>{S.cv=d.exists?d.data():{};if(curView==="entrenar")rerender()},err));
    if(S.inFamily){const nm=new Date(now.getFullYear(),now.getMonth()+1,1);[today.slice(0,7),ymd(nm).slice(0,7)].forEach(m=>unsubs.push(FS.collection("menu").doc("m-"+m).onSnapshot(d=>{Object.assign(S.fm,(d.exists&&d.data().days)||{});if(curView==="hoy")rerender()},err)))}
    if(S.admin){
      unsubs.push(FS.collection("profiles").onSnapshot(async snap=>{
        if(snap.empty&&!seedProfiles.done){seedProfiles.done=true;const b=FS.batch();seedProfiles(S.me.email).forEach((p,i)=>b.set(FS.collection("profiles").doc(p.id),Object.assign({},p.info,{orden:i})));await b.commit().catch(err);return}
        onList(snap)},err));
    }else{
      unsubs.push(FS.collection("profiles").where("email","==",S.me.email).onSnapshot(onList,err));
      if(S.inFamily)unsubs.push(FS.collection("profiles").where("familia","==",true).onSnapshot(onList,err));
    }
  });
}
function watchData(id){
  unsubs.push(FS.collection("profiles").doc(id).collection("data").onSnapshot(snap=>{
    const p=S.profiles[id];if(!p)return;
    snap.docs.forEach(d=>{const v=d.data()||{};if(pending[id+"/"+d.id])return;
      if(d.id==="medidas")p.medidas=Array.isArray(v.list)?v.list:[];
      else if(d.id==="settings")p.settings=Object.assign({metaCerv:6,time:60,mode:"fuerza"},v);
      else if(d.id.startsWith("m-"))Object.assign(p.days,v.days||{});
    });
    if(id===S.cur)rerender();
  },e=>console.warn(e)));
}

function afterData(){
  hideSplash();

}

function alloc(gs,n){
  const tot=gs.reduce((a,g)=>a+G[g].w,0);
  const cnt=gs.map(g=>Math.max(1,Math.floor(n*G[g].w/tot)));
  let s=cnt.reduce((a,b)=>a+b,0),i=0;
  while(s<n){cnt[i%gs.length]++;s++;i++}
  while(s>n){const j=cnt.indexOf(Math.max(...cnt));cnt[j]--;s--}
  return cnt;
}
function pickRoutine(gs,need){
  const order=[...gs].sort((a,b)=>(a==="abdomen")-(b==="abdomen")||G[b].w-G[a].w);
  const r=rng(hash(order.join("+")+"|"+blockIdx+"|"+S.cur));
  const cnt=alloc(order,need),used=new Set(),out=[];
  order.forEach((g,gi)=>{
    const all=[...new Set(G[g].slots.flat())];
    for(let i=0;i<cnt[gi];i++){
      let pool=(G[g].slots[i]||[]).filter(x=>!used.has(x));
      if(!pool.length)pool=all.filter(x=>!used.has(x));
      let gg=g;
      if(!pool.length&&G[g].rel){gg=G[g].rel;pool=[...new Set(G[gg].slots.flat())].filter(x=>!used.has(x))}
      if(!pool.length)pool=all;
      const id=pool[Math.floor(r()*pool.length)];used.add(id);out.push({id,g:gg});
    }
  });
  return out;
}

function cardioPlan(gk,T,lv,home){

      {h:"Bloque 1",r:llano+" min",items:[["",[],llano+" min a 85–95 rpm, resistencia media: respiras agitado pero puedes hablar","cx_spin_llano","spinning"]]},
      {h:"Bloque 2",r:subidas+" subidas",items:[["",[],subidas+" × 2 min a 60–70 rpm (sentado y de pie), 1 min suave entre cada una","cx_spin_sub","spinning"]]},
      {h:"Bloque 3",r:spr+" intervalos",items:[["",[],spr+" × "+W[0]+" s a máxima velocidad / "+W[1]+" s suave","cx_spin_spr","spinning"]]},

      {h:"Progresión",r:"Cada 2 semanas",items:[["Cómo avanzar",["cardio"],"Semanas 1–2: así como está. Semanas 3–4: agrega 2 sprints y 1 subida. Semana 5 en adelante: sube un punto la resistencia en las subidas."]]}];
  }

    {h:"Calentamiento",r:"5 min",items:[["Movilidad de tobillos, rodillas y hombros",["cardio"],"3 min"],["Salto suave sin prisa",["cardio","pantorrilla"],"2 min"]]},
    {h:"Técnica",r:"Sin descanso entre ejercicios",items:[["Salto básico (pies juntos)",["pantorrilla","cardio"],"40 s"],["Salto alterno (como trote)",["pantorrilla","cardio"],"40 s"],["Rodillas arriba",["cuadriceps","cardio"],"30 s"],["Saltos laterales",["pantorrilla","gluteo"],"30 s"]].concat(lv==="av"?[["Cruzados o dobles saltos",["pantorrilla","hombro"],"30 s"]]:[])},

  return b;

function pickByGroup(plan){

      if(!pool.length)break;

/* ---------- Análisis de composición corporal ---------- */
function navyBF(sexo,cm,cintura,cuello,cadera){
  if(!cm||!cintura||!cuello)return null;
  if(sexo==="m"){if(!cadera||cintura+cadera-cuello<=0)return null;return 495/(1.29579-.35004*Math.log10(cintura+cadera-cuello)+.221*Math.log10(cm))-450}
  if(cintura-cuello<=0)return null;return 495/(1.0324-.19077*Math.log10(cintura-cuello)+.15456*Math.log10(cm))-450;
}
function bodyAnalysis(p){
  const i=p.info,cm=+i.estatura;const rows=[...(p.medidas||[])].filter(r=>Object.keys(r).some(k=>k!=="f"&&r[k]!==""&&r[k]!=null)).sort((a,b)=>a.f<b.f?-1:1);
  if(rows.length<1)return null;
  const val=(r,k)=>r&&r[k]!==""&&r[k]!=null?+r[k]:null;
  const lastWith=k=>{for(let j=rows.length-1;j>=0;j--)if(val(rows[j],k)!=null)return rows[j];return null};
  const firstWith=k=>rows.find(r=>val(r,k)!=null)||null;
  const comp=r=>{const w=val(r,"peso")||lastPeso(p),bf=navyBF(i.sexo,cm,val(r,"cintura"),val(r,"cuello"),val(r,"cadera"));return bf!=null&&w?{bf,fat:w*bf/100,lean:w*(1-bf/100),w}:null};
  const withBF=rows.filter(r=>comp(r));const a=withBF[0],b=withBF[withBF.length-1];
  const ca=a&&comp(a),cb=b&&comp(b);
  const dif=k=>{const f=firstWith(k),l=lastWith(k);return f&&l&&f!==l?val(l,k)-val(f,k):null};
  const dW=dif("peso"),dWa=dif("cintura"),dHip=dif("cadera"),musc=["brazo","pecho","pierna"].map(dif).filter(x=>x!=null);
  const dM=musc.length?musc.reduce((s,x)=>s+x,0)/musc.length:null;
  const waist=val(lastWith("cintura"),"cintura");const whtr=waist&&cm?waist/cm:null;
  let verdict="",tone="n";
  const dFat=ca&&cb&&a!==b?cb.fat-ca.fat:null,dLean=ca&&cb&&a!==b?cb.lean-ca.lean:null;
  if(dFat!=null){
    if(dFat<-0.3&&dLean>-0.3){verdict=Math.abs(dW||0)<1?"Recomposición corporal: estás perdiendo grasa y conservando o ganando músculo, aunque la báscula casi no se mueva. ¡Vas muy bien!":"Estás bajando grasa y cuidando tu músculo. ¡Vas muy bien!";tone="g"}
    else if(dFat<-0.3&&dLean<=-0.3){verdict="Bajas grasa, pero también algo de músculo. Sube un poco la proteína, no te saltes las pesas y no recortes más calorías.";tone="w"}
    else if(dFat>0.3&&dLean>0.3){verdict="Estás ganando músculo y algo de grasa. Si tu meta es ganar músculo es normal; si quieres definir, ajusta un poco las calorías.";tone=i.objetivo==="ganar"?"g":"w"}
    else if(dFat>0.3){verdict="Está subiendo la grasa. Revisa porciones, snacks y bebidas, y mantén tus entrenamientos.";tone="r"}
    else{verdict="Tu composición se mantiene estable.";tone="n"}
  }else if(dWa!=null||dW!=null){
    if(dWa!=null&&dWa<0&&(dW==null||dW>-0.5)&&(dM==null||dM>=0)){verdict="Recomposición corporal: la cintura baja aunque el peso casi no cambie. Eso es perder grasa y ganar músculo. ¡Vas muy bien!";tone="g"}
    else if(dWa!=null&&dWa<0){verdict="Bajan tu peso y tu cintura: estás perdiendo grasa.";tone="g"}
    else if(dWa!=null&&dWa>0&&dW!=null&&dW>0){verdict=i.objetivo==="ganar"&&dWa<1?"Subes de peso con poco cambio en la cintura: buen ritmo para ganar músculo.":"Suben el peso y la cintura: probablemente es grasa. Revisa porciones y bebidas.";tone=i.objetivo==="ganar"&&dWa<1?"g":"r"}
    else if(dW!=null&&dW<0&&dM!=null&&dM<-0.5){verdict="Baja el peso, pero también tus medidas de brazo, pecho o pierna: puede ser pérdida de músculo. Sube la proteína y mantén las pesas.";tone="w"}
    else{verdict="Sigue registrando cintura, cadera y brazo cada semana para ver tu avance real, no solo el peso.";tone="n"}
  }
  return{rows,ca,cb,dW,dWa,dHip,dM,whtr,verdict,tone,hasNeck:!!lastWith("cuello")};
}
function bodyHTML(p){

  ${A.whtr?`<p class="small" style="margin:10px 0 0">Cintura / estatura: <b>${A.whtr.toFixed(2)}</b> ${A.whtr<.5?"(saludable, menos de 0.50)":A.whtr<.6?"(arriba de lo recomendado; la meta es menos de 0.50)":"(riesgo alto; la meta es menos de 0.50)"}.</p>`:""}
  <p class="small" style="margin:8px 0 0">Comparamos tu primer y tu último registro. ${A.hasNeck?"El % de grasa se estima con la fórmula de la Marina de EE. UU. (cintura, cuello"+(p.info.sexo==="m"?", cadera":"")+" y estatura).":"Para estimar tu % de grasa y tu masa magra, registra también el <b>cuello</b>"+(p.info.sexo==="m"?" y la <b>cadera</b>":"")+"."} Si el peso no baja pero la cintura sí, estás quemando grasa y ganando músculo.</p></div>`;
}

  const sd=getDay(cal.sel,p),sdd=parseYmd(cal.sel);

  const cls=(m,k)=>{if(k===0||m[3]===0)return"";const prev=rows[k-1][m[0]],v=rows[k][m[0]];if(prev==null||v==null||prev===""||v==="")return"";const d=v-prev;

async function fillPhotos(){
  const p=P(),wkKey=ymd(mondayOf(now));let keys=[];
  try{keys=(await idb.keys()).map(String).filter(k=>k.startsWith(p.id+"|"))}catch(e){const m=$("#fMsg");if(m)m.textContent="Este navegador no permite guardar fotos.";return}
  for(const x of POSES){const el=$("#ph-"+x[0]);if(!el)continue;const k=p.id+"|"+wkKey+"|"+x[0];const src=keys.includes(k)?await idb.get(k):null;el.innerHTML=src?`<img src="${src}" alt="${x[1]}, esta semana">`:`<span>${x[1]}</span>`}
  const weeks=[...new Set(keys.map(k=>k.split("|")[1]))].sort();const wa=$("#wa"),wb=$("#wb");if(!wa)return;
  if(weeks.length<2){wa.hidden=wb.hidden=true;return}

  const draw=async()=>{let h="";for(const x of POSES){const a=keys.includes(p.id+"|"+wa.value+"|"+x[0])?await idb.get(p.id+"|"+wa.value+"|"+x[0]):null;const b=keys.includes(p.id+"|"+wb.value+"|"+x[0])?await idb.get(p.id+"|"+wb.value+"|"+x[0]):null;if(!a&&!b)continue;
    h+=`<div class="pairp"><div>${a?`<img src="${a}" alt="${x[1]}, inicio">`:"<span>Sin foto</span>"}</div><div>${b?`<img src="${b}" alt="${x[1]}, después">`:"<span>Sin foto</span>"}</div></div><div class="small" style="text-align:center;margin:4px 0 10px">${x[1]}</div>`}
    $("#cmp").innerHTML=h||"No hay fotos en esas semanas."};
  wa.onchange=draw;wb.onchange=draw;draw();
}

function renderLibList(){

    gs.forEach(([m,t])=>{

  const go=()=>{readConfig();
    if(FIREBASE_CONFIG){show(curView,true);bootCloud();return}
    localLoad();setSync("Modo local");show(curView,true);rerender();hideSplash();setTimeout(restoreDraft,300)};
  if(window.PLAN_CONFIG)return go();
  /* config.js se carga sin bloquear la pantalla; si tarda más de 8 s seguimos igual */
  let done=false;const fin=()=>{if(!done){done=true;go()}};
  const s=document.createElement("script");s.src="config.js?v="+APP_VERSION;s.onload=fin;s.onerror=fin;document.head.appendChild(s);
  setTimeout(()=>{const m=document.getElementById("splashMsg");if(!done&&m)m.textContent="La señal está lenta, seguimos intentando…"},4000);
  setTimeout(fin,8000);
})();
</script>
</body>
